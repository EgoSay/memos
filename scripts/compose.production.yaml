services:
  memos:
    # GitHub builds and checks the complete image before Dokploy pulls it.
    # An immutable commit tag can be supplied for a rollback.
    image: ghcr.io/egosay/memos-journal@sha256:9b5136aeed10886f1dfe537e2204d62ed68ecf5eee4a1305143df944d4e2f639
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    mem_limit: 384m
    cpus: 0.5
    environment:
      TZ: Asia/Shanghai
      MEMOS_PORT: "5230"
      MEMOS_DATA: /var/opt/memos
      MEMOS_DRIVER: sqlite
      MEMOS_INSTANCE_URL: ${MEMOS_INSTANCE_URL:?Set the external HTTPS URL}
    volumes:
      - memos-data:/var/opt/memos
    # Dokploy/Tunnel reaches this port on the container network. No host port
    # or public router is created before the owner account is initialized.
    expose:
      - "5230"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${MEMOS_TUNNEL_TOKEN:?Set the token of the dedicated Memos tunnel}
    depends_on:
      memos:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    # In Cloudflare, add the hostname only after owner initialization:
    # journal.example.com -> http://memos:5230

volumes:
  memos-data:
